name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Converts both fixtures in a real browser, then checks the EPUBs are
      # well formed and that the structure survived the round trip.
      - run: npm test
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: converted-epubs
          path: test/out/
          if-no-files-found: ignore
