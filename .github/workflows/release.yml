name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npx tsc -noEmit -skipLibCheck
      - run: npm test
      - run: node esbuild.config.mjs production

      # The tag must equal manifest.version exactly. Obsidian doesn't error on
      # a mismatch — it just never offers the update, which is far harder to
      # diagnose after the fact than a failed build here.
      - name: Preflight
        run: node scripts/preflight.mjs "$GITHUB_REF_NAME"

      # Obsidian fetches these three by name from the release assets. They must
      # be loose files, not a zip.
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            main.js manifest.json styles.css
